# ==============================================================
# SonarCloud - produits-front
# ==============================================================

# -- Identification --------------------------------------------
sonar.projectKey=produits-front
sonar.projectName=Produits Front
sonar.projectVersion=0.0.0

# -- Sources ---------------------------------------------------
sonar.sources=src
sonar.sourceEncoding=UTF-8

# -- Tests -----------------------------------------------------
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# -- Couverture LCOV (genere par Vitest) -----------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# -- Exclusions ------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/*.spec.ts,\
  **/environments/**,\
  src/main.ts

sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/environments/**,\
  src/main.ts,\
  src/app/app.config.ts,\
  src/app/app.routes.ts

# -- Quality Gate ----------------------------------------------
# Aucun seuil de couverture pour le frontend
# SonarCloud = reporting uniquement (plan gratuit)
sonar.qualitygate.wait=false

# -- Connexion SonarCloud --------------------------------------
sonar.host.url=https://sonarcloud.io
sonar.organization=elhadj-cloud-lab
# sonar.token : passer via -Dsonar.token=... ou env SONAR_TOKEN
